<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<style>
#l10n-language-toggle{position:fixed;z-index:9999;top:12px;right:16px;display:flex;gap:4px;padding:4px;background:#fff;border:1px solid #d9dce5;border-radius:10px;box-shadow:0 2px 10px #0002}
#l10n-language-toggle button{border:0;border-radius:7px;background:transparent;padding:6px 10px;font-size:13px;cursor:pointer;color:#303746}
#l10n-language-toggle button[aria-pressed=true]{background:#4f46e5;color:#fff;font-weight:600}
@media(max-width:600px){#l10n-language-toggle{top:auto;bottom:12px;right:12px}}
</style>
<script>
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js').catch(() => {}));
</script>
