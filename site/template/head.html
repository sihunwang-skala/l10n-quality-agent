<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>@@TITLE@@</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1f26;--mute:#3b4554;--line:#e4e8ee;--bg:#fff;--soft:#f5f7fa;--navy:#12315c;--blue:#2f63b5;--grey:#a9b6c7;--red:#c0392b;--teal:#8fb4b7}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.7 Inter,"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
nav{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:24px;align-items:center;height:50px;overflow-x:auto;white-space:nowrap}
nav b{margin-right:auto;font-weight:700}nav a{color:var(--mute);text-decoration:none;font-size:14px;font-weight:500}nav a:hover{color:var(--navy)}nav a.ext{color:var(--navy);font-weight:700}
.hero{text-align:center;padding:56px 0 20px}
h1{font-size:clamp(28px,4.6vw,46px);line-height:1.22;font-weight:800;letter-spacing:-.02em;margin:0 auto 14px;max-width:900px}
h1 em{font-style:normal;color:var(--blue)}
.slogan{font-size:clamp(17px,2.2vw,22px);font-weight:600;color:var(--mute);margin:0 0 18px}
.auth{font-size:18px;margin:6px 0 2px}.aff{color:var(--mute);font-size:15px}
.btns{display:flex;gap:10px;justify-content:center;margin:20px 0 26px;flex-wrap:wrap}
.btn{background:#111a2b;color:#fff;text-decoration:none;font-weight:600;padding:9px 20px;border-radius:10px;font-size:15px}.btn:hover{background:var(--blue)}
.tldr{font-size:19px;max-width:880px;margin:0 auto 26px}.tldr b{font-weight:800}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:8px 0 6px;text-align:left}
.kpi{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi b{display:block;font-size:30px;line-height:1.1;color:#d62828;font-weight:800}.rd{color:var(--navy);font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.chips span{background:#e8f0fb;border:1.5px solid #7fa8dc;color:#12315c;font-weight:600;font-size:13.5px;padding:4px 12px;border-radius:99px}
.hl{background:linear-gradient(transparent 55%,#ffe27a 55%);font-weight:700;color:inherit;padding:0 1px}
.kpi .na{font-style:normal;color:#6a7685}
.kpi .d{font-style:normal;font-weight:800;color:var(--navy)}
.kpi .kl{display:block;font-size:15.5px;font-weight:800;color:#0f2238;margin:2px 0 6px;line-height:1.35}
.kpi span{font-size:13px;color:var(--mute);line-height:1.4;display:block;margin-top:4px}
section{padding:44px 0;border-top:1px solid var(--line)}
.num{font-size:12.5px;font-weight:700;color:var(--blue);letter-spacing:.1em}
h2{font-size:clamp(24px,3.2vw,32px);margin:2px 0 8px;letter-spacing:-.015em;font-weight:800}
.sub{color:var(--mute);margin:0 0 22px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.card{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:18px 20px}.card h3{margin:0 0 6px;font-size:16.5px}.card p{margin:0;color:var(--mute);font-size:15px}
.card.bad{border-top:4px solid var(--navy)}.card.good{border-top:4px solid var(--navy)}
.fig{margin:0 0 18px}.fig .svgbox{overflow-x:auto;border:1px solid var(--line);border-radius:16px;padding:12px;background:#fff}.fig svg{display:block;width:100%;min-width:820px;height:auto;font-family:Inter,"Noto Sans KR",sans-serif}
.cap,.cap2{font-size:14px;color:var(--mute);margin:10px 4px 0}.cap b,.cap2 b{color:var(--ink)}
.pipe{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin:10px 0 0}
.pipe .s{flex:1 1 170px;background:#cfe0e1;border:1.5px solid #111;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45}.pipe .s b{display:block;font-size:14.5px}.pipe .s small{color:#1c3235}
.pipe .s.p{background:#f0c8c8}.pipe .a{align-self:center;font-weight:700}
.grid6{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chart{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.chart h3{margin:0 0 2px;font-size:16.5px}.chart .q{color:#2c3644;font-size:13.5px;margin:0 0 12px;line-height:1.5}
.row{display:grid;grid-template-columns:178px 1fr;gap:10px;align-items:center;height:24px;margin:6px 0}.row .name{font-size:12.5px;line-height:1.25;white-space:nowrap}.row .name.n0{font-weight:700;color:#2b7a4b}.row .name.n1{font-weight:700;color:#6a5fb0}.row .name.n2{font-weight:700;color:#2a68ad}.row .name.n3{font-weight:800;color:#8a6200}
.row .name.final{font-weight:800;color:#8a6200}
.track{background:var(--soft);border-radius:5px;height:17px;overflow:hidden;display:flex;align-items:center}
.bar{height:100%;border-radius:5px;background:var(--grey);display:flex;align-items:center;justify-content:flex-end;padding-right:7px;font-size:11px;font-weight:700;color:#fff;min-width:40px}
.bar.c0{background:#7cc096}.bar.c1{background:#a597d9}.bar.c2{background:#7fa8dc}
.bar.final{background:#ffc928;color:#3b2c00}.bar.red{background:var(--red)}.ztxt{padding-left:8px;font-size:12.5px;font-weight:700;color:var(--navy)}
.row .name.final+.track .ztxt{color:#b81f1f;font-size:14px}
.gt{font-size:12.5px;font-weight:700;color:var(--mute);margin:12px 0 2px;letter-spacing:.02em}
.method{margin:12px 0 0;font-size:13px;line-height:1.55;color:#33414f;border-top:1px dashed var(--line);padding-top:10px}.method b{color:#12315c;margin-right:4px}
.note{margin:10px 0 0;font-size:13.5px;color:var(--mute);line-height:1.55}
.caveat{margin-top:16px;border:1px dashed var(--grey);border-radius:14px;padding:14px 18px;font-size:14px;color:var(--mute)}.caveat b{color:var(--ink)}
.grp{margin:30px 0 12px;font-size:17px;font-weight:700}.grp small{color:var(--mute);font-weight:400;margin-left:8px}
figure{margin:0}figure img{width:100%;display:block;border-radius:12px;border:1px solid var(--line)}figcaption{font-size:14px;color:var(--mute);margin-top:8px}figcaption b{color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.mob{display:grid;grid-template-columns:230px 1fr;gap:20px;align-items:start}.mob img{max-width:230px}
.tbl{width:100%;border-collapse:collapse;border:1px solid var(--line);font-size:12px;line-height:1.5}.tbl td,.tbl th{padding:6px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.tbl th{width:170px;color:var(--mute);font-weight:600;background:var(--soft)}.tbl tr:last-child td,.tbl tr:last-child th{border-bottom:0}.tbl a{color:var(--blue)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.tile{margin:0;position:relative}.tile.key .shot{border:3px solid #ffc928;box-shadow:0 6px 20px rgba(255,201,40,.35)}.shot{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:zoom-in;overflow:hidden;transition:box-shadow .15s,transform .15s}
.shot:hover{box-shadow:0 8px 24px rgba(18,49,92,.18);transform:translateY(-2px)}
.tiles .shot img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top left;border:0;border-radius:0}
.tile figcaption,.details figcaption{font-size:13px;line-height:1.55}.tile figcaption b,.details figcaption b{font-size:17px;line-height:1.4}
.tg{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;margin-right:6px;color:#fff;vertical-align:1px}.tg.u{background:#12315c}.tg.c{background:#2f7d7a}
.details{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;align-items:start}.details .shot img{width:100%;border:0;border-radius:0}.phone .shot{width:auto;display:block;margin:0 auto}.phone .shot img{width:auto;height:240px;display:block;margin:0 auto}.phone figcaption{text-align:left}
.steps{margin-top:6px}.steps th{width:auto;background:var(--soft)}.steps td small{color:var(--mute)}
.hot{cursor:pointer}.hot:hover rect{stroke:#d62828;stroke-width:2.6}.hot.sel rect{stroke:#d62828;stroke-width:3.4}.detail{border:1px dashed #b6c0cd;border-radius:12px;padding:14px 18px;margin:0 0 22px;font-size:14.5px;line-height:1.65;color:#2c3644}.detail.on{border:1.5px solid #d62828;background:#fff8f8}.detail p{margin:6px 0 0}.detail ul{margin:8px 0 0;padding-left:20px}.detail li{margin:3px 0}.detail b{color:#12315c}
.toggles{margin:6px 0 22px}.toggles details{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fff}.toggles summary{cursor:pointer;padding:11px 16px;font-weight:700;font-size:15px;list-style:none;display:flex;justify-content:space-between;align-items:center}.toggles summary::-webkit-details-marker{display:none}.toggles summary::after{content:'+';color:#d62828;font-size:20px;font-weight:700}.toggles details[open] summary::after{content:'\2212'}.toggles details[open]{border-color:#d62828}.toggles p{margin:0;padding:0 16px 14px;font-size:14.5px;color:#2c3644;line-height:1.65}
.kw{list-style:none;margin:6px 0 0;padding:0}.kw li{font-size:14.5px;line-height:1.55;color:#2c3644;padding:4px 0 4px 14px;position:relative}.kw li::before{content:'';position:absolute;left:0;top:13px;width:6px;height:6px;border-radius:50%;background:#9aa6b4}.kw li.to{font-weight:600;color:#12315c}.kw li.to::before{content:'\2192';background:none;width:auto;height:auto;top:4px;left:-2px;font-weight:700;color:#d62828}.kw li.to{padding-left:18px}
.how{background:#f5f7fa;border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:13.5px;line-height:1.55}.how p{margin:6px 0 0}.how span{color:var(--mute)}
.lb{position:fixed;inset:0;z-index:50;background:rgba(10,16,26,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}.lb[hidden]{display:none}
.lb img{max-width:96vw;max-height:84vh;border-radius:8px;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.5)}.lb p{color:#fff;font-size:15px;margin:12px 0 0;text-align:center}.lbx{position:absolute;top:14px;right:20px;background:none;border:0;color:#fff;font-size:38px;cursor:pointer}
@media (max-width:980px){.details{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.tiles,.details{grid-template-columns:1fr}}
footer{padding:28px 0 56px;color:var(--mute);font-size:14px;border-top:1px solid var(--line);text-align:center}
@media (max-width:820px){.kpis{grid-template-columns:1fr 1fr}.grid6,.grid2,.mob{grid-template-columns:1fr}.row{grid-template-columns:150px 1fr;gap:8px}.tbl th{width:100px}}

.fin{display:inline-block;margin-left:8px;vertical-align:2px;background:#ffc928;color:#3b2c00;font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:99px;letter-spacing:.02em}
.grid6.one{grid-template-columns:1fr}details.allres{margin:18px 0 6px}details.allres summary{cursor:pointer;list-style:none;border:1.5px solid var(--line);border-radius:14px;padding:14px 56px 14px 20px;font-weight:800;font-size:16px;background:var(--soft);position:relative}details.allres summary::-webkit-details-marker{display:none}details.allres summary::after{content:"+";position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:24px;font-weight:600;color:var(--blue)}details.allres[open] summary::after{content:"−"}details.allres summary:hover{border-color:var(--blue)}details.allres summary small{display:block;font-weight:500;font-size:13px;color:var(--mute);margin-top:2px}details.allres[open] summary{margin-bottom:18px}
.note2{margin:10px 0 0;font-size:13.5px;color:var(--mute);line-height:1.55}.note2 b{color:var(--ink)}.chart.key{border:1px solid #ffc928}
nav{background:var(--bg)}nav b{margin-right:0}nav .sp{flex:1}.tb{font:inherit;font-size:15px;line-height:1;background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:6px 10px;cursor:pointer}.tb:hover{color:var(--navy);border-color:var(--navy)}
html[data-theme=dark]{--ink:#e8ecf1;--mute:#b4bfcc;--line:#2b3441;--bg:#0f141b;--soft:#171e28;--navy:#a9c6f2;--blue:#7aa5e6;--grey:#4a5666;color-scheme:dark}
html[data-theme=dark] .chart,html[data-theme=dark] .toggles details{background:var(--soft)}
html[data-theme=dark] .kpi b{color:#ff7b7b}html[data-theme=dark] .kpi .kl{color:var(--ink)}
html[data-theme=dark] .row .name.n0{color:#6fd09a}html[data-theme=dark] .row .name.n1{color:#b9aef0}html[data-theme=dark] .row .name.n2{color:#8ab8ee}html[data-theme=dark] .row .name.n3,html[data-theme=dark] .row .name.final{color:#ffc928}
html[data-theme=dark] .row .name.final+.track .ztxt{color:#ff8a8a}
html[data-theme=dark] .chart .q,html[data-theme=dark] .method,html[data-theme=dark] .detail,html[data-theme=dark] .kw li{color:var(--mute)}html[data-theme=dark] .method b,html[data-theme=dark] .kw li.to{color:var(--navy)}
html[data-theme=dark] .detail.on{background:#2a1a1d}html[data-theme=dark] .hl{background:linear-gradient(transparent 55%,rgba(255,201,40,.45) 55%)}
html[data-theme=dark] .tg.u{background:#3d5f94}html[data-theme=dark] .card.bad,html[data-theme=dark] .card.good{border-top-color:var(--blue)}
html[data-theme=dark] .num{color:var(--blue)}html[data-theme=dark] h1 em{color:#7aa5e6}
html[data-theme=dark] .fig .svgbox{background:#f5f7fa}html[data-theme=dark] figure img{opacity:.93}


:root{--ink:#151515;--mute:#6b6b6b;--line:#e9e9eb;--bg:#fff;--soft:#f6f6f8;--navy:#2f2a6b;--blue:#3b46b0;--ac:#2f2a6b;--grey:#b9b9c2}
html[data-theme=dark]{--ink:#f0f0f2;--mute:#a4a4ad;--line:#2a2a31;--bg:#0f0f12;--soft:#17171c;--navy:#b7b3f2;--blue:#8f98f0;--ac:#b7b3f2;--grey:#4b4b55;color-scheme:dark}
body{font:400 16px/1.65 Manrope,"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink);word-break:keep-all}
.hero{text-align:left}
.col{max-width:1000px;margin:0 auto;padding:0 48px}

.logo{font:600 22px/1 Inter,sans-serif;letter-spacing:-.04em;color:var(--ink);text-decoration:none}

.t0,.t1{color:var(--mute);padding:3px 0}.t1{padding-left:10px}

.side-b{margin-top:auto;padding-top:20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.cp{width:100%;font-size:11.5px;color:var(--mute);margin-top:10px}
.tb{font:600 12px/1 Manrope,sans-serif;background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:7px 11px;cursor:pointer}.tb:hover{color:var(--ink);border-color:var(--ink)}
.topbar{display:none}
main{margin-left:236px}
.hero{padding:64px 0 40px;min-height:min(100vh,760px);display:flex;align-items:center}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:48px;align-items:center;width:100%}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:26px}.tags span{background:var(--soft);color:var(--ink);font-size:12px;font-weight:600;padding:5px 11px;border-radius:99px}

.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 28px;border-top:1px solid var(--line);margin-top:34px;padding-top:22px;max-width:600px}
.meta .k{font-size:11px;letter-spacing:.12em;color:var(--mute);font-weight:600;margin-bottom:4px}.meta .v{font-size:14.5px;line-height:1.5}
.ext-link{display:inline-block;margin-top:28px;color:var(--ink);font-weight:600;font-size:14.5px;text-decoration:none;border-bottom:1px solid var(--ink)}
