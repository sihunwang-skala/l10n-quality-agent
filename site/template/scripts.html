<script>

  var box=sc.querySelector('.scene'),r=box.getBoundingClientRect(),total=r.height-innerHeight,p=pinned&&total>0?clamp(-r.top/total):1;

  if(pinned&&n>1){var cur=(sc.__idx===undefined)?want:sc.__idx,now=performance.now();
   if(want!==cur){if(!sc.__t||now-sc.__t>700){cur+=want>cur?1:-1;sc.__t=now}setTimeout(req,720)}

  sc.querySelectorAll('[data-at]').forEach(function(e){var on=p>=+e.dataset.at||!pinned;e.classList.toggle('on',on);if(on)e.querySelectorAll('.cnt').forEach(count)});
  var hm=sc.querySelector('[data-fill]');if(hm){wrap(hm);var ws=hm.querySelectorAll('.w'),m=pinned?Math.ceil(clamp((p-0.06)/0.62)*ws.length):ws.length;ws.forEach(function(w,i){w.classList.toggle('on',i<m)});hm.classList.toggle('done',m>=ws.length)}

(function(){

var box=document.querySelector('#architecture .fig .svgbox'),detail=document.getElementById('detail');

 hots.forEach(function(g,i){g.style.setProperty('--d',i);g.addEventListener('click',function(){used=true})});

(function(){
var f2=document.querySelector('svg[aria-label^="Figure 2"]');if(!f2)return;
var items=null,timers=[],box=f2.closest('.svgbox')||f2;
function init(){if(items)return;var kids=[].slice.call(f2.children).filter(function(e){return e.tagName.toLowerCase()!=='defs'});

function hide(){timers.forEach(clearTimeout);timers=[];items.forEach(function(it){if(it.row<0)return;it.e.style.transition='none';it.e.style.opacity=0;it.e.style.transform='translateY(10px)'})}
function play(){init();hide();void f2.getBoundingClientRect();

  row.forEach(function(it,k){timers.push(setTimeout(function(){it.e.style.transition='opacity .3s ease,transform .3s ease';it.e.style.opacity=1;it.e.style.transform='none'},120+r*300+k*14))})})(r)}}

new IntersectionObserver(function(es){es.forEach(function(e){if(reduce)return;if(e.isIntersecting)play();else if(items)hide()})},{threshold:.5}).observe(box);

/* keyboard: up/down (PageUp/PageDown) step through the pinned scenes one stage at a time */
(function(){
var STOPS={context:[.5,.98],decision:[.5,.98],impact:[.12,.34,.56,.78,.98],'user-problem':[.25,.6,.98],define:[.5],approach:[.08,.31,.54,.77,.98]};
function stopsFor(sc){var n=0;sc.querySelectorAll('[data-beat]').forEach(function(e){n=Math.max(n,+e.dataset.beat+1)});
 if(n>1){var a=[];for(var i=0;i<n;i++)a.push(.04+.92*(i+.5)/n);return a}

 var k=e.key;if(k!=='ArrowDown'&&k!=='ArrowUp'&&k!=='PageDown'&&k!=='PageUp')return;
 var t=e.target;if(t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable))return;
 if(document.querySelector('.lb:not([hidden])'))return;
 var a=active();if(!a)return;var st=stopsFor(a.sc);if(!st)return;
 var total=a.r.height-innerHeight,p=Math.max(0,Math.min(1,-a.r.top/total)),down=(k==='ArrowDown'||k==='PageDown'),target=null;
 if(down){for(var i=0;i<st.length;i++){if(st[i]>p+.012){target=st[i];break}}}else{for(var j=st.length-1;j>=0;j--){if(st[j]<p-.012){target=st[j];break}}}

});
})();

(function(){

var auto=true;var seen={};window.__galBusy=function(){return auto&&Object.keys(seen).length<n};

/* the example question types itself and the chips pop in by themselves (no scrolling needed) */
(function(){
var root=document.documentElement;
function inView(el){var r=el.getBoundingClientRect();return r.top<innerHeight*.85&&r.bottom>innerHeight*.15}
function reset(q){q.__st=0;clearTimeout(q.__t);q.classList.remove('typed');var tx=q.querySelector('.tx');if(tx)tx.textContent='';q.querySelectorAll('.chip').forEach(function(c){c.classList.remove('on')});var cr=q.querySelector('.caret');if(cr)cr.style.display=''}

 (function type(){if(q.__st!==1)return;i++;tx.textContent=txt.slice(0,i);if(i<txt.length){q.__t=setTimeout(type,42)}else{q.classList.add('typed');var k=0;(function pop(){if(q.__st!==1)return;if(k<chips.length){chips[k++].classList.add('on');q.__t=setTimeout(pop,190)}else{q.__st=2}})()}})()}

  if(vis&&!q.__st)play(q);else if(!vis&&q.__st)reset(q)})}

})();

(function(){var w=document.getElementById('phw');if(!w)return;var im=w.querySelectorAll('.pi'),bt=w.querySelectorAll('.ph-tabs button'),cur=0,t=null,user=false,n=im.length/2,fin=false;

/* autoplay: the page moves on by itself (scene beats, sections, gallery); any wheel/touch/key/click pauses it for a few seconds, or press the button to stop it */
(function(){

['wheel','touchstart','keydown','mousedown'].forEach(function(ev){addEventListener(ev,function(){lastUser=Date.now()},{passive:true,capture:true})});
function go(y){scrollTo({top:y,behavior:'smooth'})}
var lastAnim=Date.now(),busySince=0;
function inView(el){var r=el.getBoundingClientRect();return r.bottom>0&&r.top<innerHeight}
function animBusy(){var busy=false;try{document.getAnimations().forEach(function(an){if(an.playState!=='running')return;var t=an.effect&&an.effect.getComputedTiming&&an.effect.getComputedTiming();if(!t||t.iterations===Infinity)return;var el=an.effect.target;if(el&&el.getBoundingClientRect&&inView(el))busy=true})}catch(e){}return busy}
function groups(){var out=[],vh=innerHeight;
 [].slice.call(document.querySelectorAll('header.hero,section.cs')).forEach(function(sec){if(sec.closest('.scn')||sec.classList.contains('scn'))return;
  var col=sec.querySelector(':scope > .col')||sec,kids=[].slice.call(col.children).filter(function(k){return k.offsetHeight>0});
  var cur=null;kids.forEach(function(k){var r=k.getBoundingClientRect(),t=r.top+scrollY,bt=r.bottom+scrollY;
   if(cur&&bt-cur.t<=vh*.85){cur.b=bt}else{if(cur)out.push(cur);cur={t:t,b:bt}}});if(cur)out.push(cur)});

function nextTarget(from){var best=null;
 groups().forEach(function(y){if(y>from+120&&(best===null||y<best))best=y});
 [].slice.call(document.querySelectorAll('.scn')).forEach(function(sc){var y=sc.querySelector('.scene').getBoundingClientRect().top+scrollY;if(y>from+24&&(best===null||y<best))best=y});
 return best}
function heroBusy(){var w=document.getElementById('phw');return w&&window.__phBusy&&window.__phBusy()&&inView(w)}
function tick(){
 var now=Date.now();if(off||document.hidden)return;
 if(animBusy()){if(!busySince)busySince=now;if(now-busySince<6000)lastAnim=now}else busySince=0;
 if(now-lastUser<IDLE)return;
 if(document.querySelector('.lb:not([hidden])'))return;
 if(now-lastAnim<1500)return;
 if(heroBusy())return;
 var a=window.__sc&&window.__sc.active();
 var dw=a?(a.sc.querySelector('.ind')?DW_BUL:DW_SCENE):DW_FREE;if(now-lastStep<dw)return;

 if(g&&window.__galBusy&&window.__galBusy()){var gr=g.getBoundingClientRect();if(gr.top<innerHeight*.5&&gr.bottom>innerHeight*.5)return}

 if(scrollY>=maxY-4)return;

  for(var i=0;i<st.length;i++){if(st[i]>p+.012){target=a.r.top+scrollY+st[i]*total;break}}
  if(target===null)target=nextTarget(a.r.top+scrollY+total)}

 target=Math.min(target,maxY);lastStep=now;go(target)}
setInterval(tick,400);
})();
</script>
